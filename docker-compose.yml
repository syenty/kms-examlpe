version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: kms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cosmian-kms:
    image: ghcr.io/cosmian/kms:latest
    container_name: cosmian-kms
    command: ["/bin/cosmian_kms"]
    ports:
      - "9998:9998"
    volumes:
      - kms_data:/root/cosmian-kms/sqlite-data
    networks:
      - kms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9998/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  kms_data:

networks:
  kms-network:
    driver: bridge
